name: Deploy static frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static frontend
        working-directory: github-repo
        run: |
          mkdir -p _site/vendor _site/screenshots
          cp index.html app.js density-3d.js style.css runtime.js _site/
          cp -R demo-data _site/
          cp vendor/three.min.js vendor/LICENSE vendor/LUCIDE-LICENSE _site/vendor/
          cp screenshots/*.png _site/screenshots/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-repo/_site
      - id: deployment
        uses: actions/deploy-pages@v4
